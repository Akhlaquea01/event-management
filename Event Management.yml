opencollection: 1.0.0
info:
  name: Event Management
config:
  proxy:
    inherit: true
    config:
      protocol: http
      hostname: ''
      port: ''
      auth:
        username: ''
        password: ''
      bypassProxy: ''
items:
  - info:
      name: create user
      type: http
      seq: 1
    http:
      method: POST
      url: http://localhost:3000/api/v1/user
      body:
        type: json
        data: |-
          {
            "name": "Admin",
            "email": "admin@admin.com",
            "password": "Pass@123",
            "role": "admin"
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: GetById
      type: http
      seq: 2
    http:
      method: GET
      url: http://localhost:3000/api/v1/user/2
      auth:
        type: bearer
        token: '{{TOKEN}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: login
      type: http
      seq: 3
    http:
      method: POST
      url: http://localhost:3000/api/v1/user/login
      body:
        type: json
        data: |-
          {
            "email": "admin@admin.com",
            "password": "Pass@123"
          }
      auth:
        type: bearer
        token: '{{TOKEN}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Register
      type: http
      seq: 4
    http:
      method: POST
      url: http://localhost:3000/register
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "name": "Alice Organizer",
            "email": "alice@example.com",
            "password": "secret123",
            "role": "organizer"
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: login
      type: http
      seq: 5
    http:
      method: POST
      url: http://localhost:3000/login
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "email": "alice@example.com",
            "password": "secret123"
          }
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Get All Events
      type: http
      seq: 6
    http:
      method: GET
      url: http://localhost:3000/events
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Get Event By ID
      type: http
      seq: 7
    http:
      method: GET
      url: http://localhost:3000/events/1
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Create Event
      type: http
      seq: 8
    http:
      method: POST
      url: http://localhost:3000/events
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "title": "Node.js Virtual Conf",
            "description": "A deep dive into Node",
            "date": "2026-10-30",
            "time": "10:00 AM",
            "capacity": 100
          }
      auth:
        type: bearer
        token: '{{TOKEN}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Update Event
      type: http
      seq: 9
    http:
      method: PUT
      url: http://localhost:3000/events/1
      headers:
        - name: Content-Type
          value: application/json
      body:
        type: json
        data: |-
          {
            "title": "Node.js Virtual Conf (Updated)",
            "description": "Updated deep dive into Node.js 24 and Express 5",
            "capacity": 150
          }
      auth:
        type: bearer
        token: '{{TOKEN}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Register For Event
      type: http
      seq: 10
    http:
      method: POST
      url: http://localhost:3000/events/1/register
      auth:
        type: bearer
        token: '{{TOKEN}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: my-registrations
      type: http
      seq: 11
    http:
      method: GET
      url: http://localhost:3000/events/my-registrations
      auth:
        type: bearer
        token: '{{TOKEN}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Cancel Event Registration
      type: http
      seq: 12
    http:
      method: DELETE
      url: http://localhost:3000/events/1/register
      auth:
        type: bearer
        token: '{{TOKEN}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Delete Event
      type: http
      seq: 13
    http:
      method: DELETE
      url: http://localhost:3000/events/1
      auth:
        type: bearer
        token: '{{TOKEN}}'
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
  - info:
      name: Health Check
      type: http
      seq: 14
    http:
      method: GET
      url: http://localhost:3000/health
      auth: inherit
    settings:
      encodeUrl: true
      timeout: 0
      followRedirects: true
      maxRedirects: 5
      forwardAuthorizationHeader: false
bundled: true
extensions:
  bruno:
    ignore:
      - node_modules
      - .git
    exportedAt: '2026-09-27T19:07:00.000Z'
    exportedUsing: Bruno
